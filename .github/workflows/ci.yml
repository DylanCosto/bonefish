name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # x86_64 Linux (AVX2/AVX-512 kernels), arm64 Linux and arm64 macOS (NEON kernels).
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: CPU (which SIMD kernels the tests exercise)
        # Lists the runner's x86 SIMD features in BONEFISH_REQUIRE_SIMD, so a kernel test that
        # skips although the CPU has its feature fails instead of passing untested.
        run: |
          if [ -r /proc/cpuinfo ]; then
            grep -m1 -E 'model name|CPU part' /proc/cpuinfo || true
            for f in avx2 avx512f avx512bw avx512vl avx512vbmi asimd; do if grep -qw "$f" /proc/cpuinfo; then echo "has $f"; fi; done
            req=$(for f in avx2 avx512bw avx512vl avx512vbmi; do grep -qw "$f" /proc/cpuinfo && printf '%s,' "$f"; done || true)
            echo "BONEFISH_REQUIRE_SIMD=${req%,}" >> "$GITHUB_ENV"
          else
            sysctl -n machdep.cpu.brand_string || true; echo "arm64 (NEON)"
          fi
      - name: Tests (unit, golden-output regression, doctests)
        run: cargo test --release --locked --features jemalloc
      - name: Validation scripts and recorded evidence
        run: |
          python3 -B -m unittest discover -s scripts/validation -p 'test_*.py'
          python3 -B scripts/validation/verify_evidence.py
          python3 -B scripts/validation/verify_clean_dp_evidence.py
